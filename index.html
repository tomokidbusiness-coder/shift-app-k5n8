<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シフト調整アプリ</title>
<style>
:root { --main:#176b63; --accent:#e5f4f1; --bg:#f5f8f7; --text:#20312f; --danger:#c62828; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; color:var(--text); background:var(--bg); line-height:1.6; }
main { max-width:1050px; margin:0 auto; padding:24px 16px 48px; }
h1 { margin:0 0 8px; font-size:clamp(1.6rem,4vw,2.2rem); }
.intro { margin:0 0 24px; color:#526460; }
.panel { background:white; border:1px solid #dce7e4; border-radius:16px; padding:20px; margin:16px 0; box-shadow:0 3px 12px #163c3510; }
h2 { margin:0 0 12px; font-size:1.2rem; }
label { font-weight:600; }
input[type=number] { width:90px; padding:10px; border:1px solid #a9bfba; border-radius:8px; font:inherit; }
.hint { font-size:.9rem; color:#61716e; margin:6px 0 0; }
.staff-list { display:grid; gap:12px; }
.staff-row { display:grid; grid-template-columns:100px 1fr; gap:10px; align-items:start; padding:12px; border:1px solid #e0e9e6; border-radius:10px; }
.staff-name { padding-top:3px; font-weight:700; }
.days { display:flex; flex-wrap:wrap; gap:8px 12px; }
.day-check { display:inline-flex; align-items:center; gap:5px; font-weight:400; white-space:nowrap; }
input[type=checkbox] { width:18px; height:18px; accent-color:var(--main); }
.actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
button { border:0; border-radius:10px; padding:12px 18px; font:inherit; font-weight:700; cursor:pointer; }
button:focus-visible, input:focus-visible { outline:3px solid #75b9ad; outline-offset:2px; }
.primary { color:white; background:var(--main); }
.secondary { color:var(--main); background:var(--accent); border:1px solid #b9dcd5; }
button:disabled { opacity:.45; cursor:not-allowed; }
.notice { padding:12px 14px; background:var(--accent); border-radius:10px; margin-top:14px; }
.error { color:var(--danger); font-weight:700; }
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; min-width:600px; }
th,td { border:1px solid #d8e4e0; padding:10px 8px; text-align:center; }
thead th { background:#eaf4f1; }
tbody th { text-align:left; white-space:nowrap; background:#fafcfb; }
td.on { font-weight:800; color:var(--main); }
td.off { color:#a0aaa7; }
tfoot th,tfoot td { background:#f4f8f6; font-weight:700; }
.small { font-size:.88rem; color:#62716e; }
@media(max-width:600px) {
 main { padding:18px 10px 32px; }
 .panel { padding:14px; }
 .staff-row { grid-template-columns:1fr; gap:6px; }
 .staff-name { padding:0; }
}
</style>
</head>
<body>
<main>
  <h1>シフト調整アプリ</h1>
  <p class="intro">出られない曜日を選び、1日に必要な人数を決めて「シフトを作る」を押してください。</p>

  <section class="panel">
    <h2>1. 1日に必要な人数</h2>
    <label for="needed">必要な人数（人）</label>
    <input id="needed" type="number" min="1" max="5" value="2">
    <p class="hint">1日あたり何人に出勤してほしいかを入力します（1〜5人）。</p>
  </section>

  <section class="panel">
    <h2>2. 出られない曜日（希望休）</h2>
    <p class="hint">チェックを入れた曜日は、そのスタッフをシフトに入れません。</p>
    <div id="staffList" class="staff-list"></div>
    <div class="actions">
      <button class="primary" id="make">シフトを作る</button>
      <button class="secondary" id="clear">希望休をすべて外す</button>
    </div>
  </section>

  <section class="panel">
    <h2>3. シフト結果</h2>
    <p class="small">「○」が出勤日です。人数が足りない日は、結果の下に赤い文字で表示します。</p>
    <div id="result" class="notice" role="status">まだシフトは作成されていません。</div>
    <div class="table-wrap" style="margin-top:14px">
      <table id="scheduleTable" aria-label="シフト結果">
        <thead><tr><th>スタッフ</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th><th>日</th><th>出勤回数</th></tr></thead>
        <tbody id="scheduleBody"><tr><td colspan="9">「シフトを作る」を押すと、ここに結果が表示されます。</td></tr></tbody>
      </table>
    </div>
    <div class="actions">
      <button class="primary" id="save" disabled>CSVを保存</button>
    </div>
    <p class="hint">CSVはExcelなどで開ける形式で保存します。</p>
  </section>
</main>
<script>
(() => {
  const names = ["スタッフA", "スタッフB", "スタッフC", "スタッフD", "スタッフE"];
  const days = ["月", "火", "水", "木", "金", "土", "日"];
  const staffList = document.getElementById("staffList");
  const result = document.getElementById("result");
  const body = document.getElementById("scheduleBody");
  const saveButton = document.getElementById("save");
  let latestSchedule = null;
  let latestCounts = null;
  let latestNeeded = 2;

  names.forEach((name, i) => {
    const row = document.createElement("div");
    row.className = "staff-row";
    const title = document.createElement("div");
    title.className = "staff-name";
    title.textContent = name;
    const dayBox = document.createElement("div");
    dayBox.className = "days";
    days.forEach((day, d) => {
      const label = document.createElement("label");
      label.className = "day-check";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "unavailable";
      checkbox.dataset.staff = String(i);
      checkbox.dataset.day = String(d);
      checkbox.setAttribute("aria-label", name + "の" + day + "曜日の希望休");
      label.append(checkbox, document.createTextNode(day + "曜"));
      dayBox.appendChild(label);
    });
    row.append(title, dayBox);
    staffList.appendChild(row);
  });

  function getUnavailable() {
    const unavailable = Array.from({length: names.length}, () => Array(7).fill(false));
    document.querySelectorAll(".unavailable").forEach(cb => {
      unavailable[Number(cb.dataset.staff)][Number(cb.dataset.day)] = cb.checked;
    });
    return unavailable;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildCandidate(unavailable, needed) {
    const schedule = Array.from({length: names.length}, () => Array(7).fill(false));
    const counts = Array(names.length).fill(0);
    let shortage = 0;
    // 各試行で曜日の順番を変え、希望休を守りながら不足が出にくい組み合わせを探す
    const dayOrder = shuffle([0,1,2,3,4,5,6]);
    for (const d of dayOrder) {
      const eligible = [];
      for (let s = 0; s < names.length; s++) {
        if (!unavailable[s][d]) eligible.push(s);
      }
      shuffle(eligible);
      eligible.sort((a,b) => counts[a] - counts[b]);
      const chosen = eligible.slice(0, needed);
      chosen.forEach(s => {
        schedule[s][d] = true;
        counts[s]++;
      });
      shortage += Math.max(0, needed - chosen.length);
    }
    const min = Math.min(...counts);
    const max = Math.max(...counts);
    const sumSquares = counts.reduce((sum, n) => sum + n*n, 0);
    // 人数不足を最優先で避け、次に出勤回数の偏りを小さくする
    const score = shortage * 100000 + (max - min) * 100 + sumSquares;
    return {schedule, counts, shortage, score};
  }

  function createSchedule() {
    const neededInput = document.getElementById("needed");
    const needed = Number(neededInput.value);
    if (!Number.isInteger(needed) || needed < 1 || needed > 5) {
      result.className = "notice error";
      result.textContent = "必要な人数は1〜5の整数で入力してください。";
      saveButton.disabled = true;
      latestSchedule = null;
      return;
    }
    const unavailable = getUnavailable();
    let best = null;
    for (let i = 0; i < 1200; i++) {
      const candidate = buildCandidate(unavailable, needed);
      if (!best || candidate.score < best.score) best = candidate;
      if (best.shortage === 0 && Math.max(...best.counts) - Math.min(...best.counts) <= 1) break;
    }
    latestSchedule = best.schedule;
    latestCounts = best.counts;
    latestNeeded = needed;
    render(best, needed);
    saveButton.disabled = false;
  }

  function render(candidate, needed) {
    body.replaceChildren();
    names.forEach((name, s) => {
      const tr = document.createElement("tr");
      const th = document.createElement("th");
      th.scope = "row";
      th.textContent = name;
      tr.appendChild(th);
      days.forEach((day, d) => {
        const td = document.createElement("td");
        if (candidate.schedule[s][d]) {
          td.textContent = "○";
          td.className = "on";
        } else {
          td.textContent = "—";
          td.className = "off";
        }
        tr.appendChild(td);
      });
      const countTd = document.createElement("td");
      countTd.textContent = candidate.counts[s] + "回";
      tr.appendChild(countTd);
      body.appendChild(tr);
    });
    const dailyCounts = days.map((_, d) => candidate.schedule.reduce((sum, staff) => sum + (staff[d] ? 1 : 0), 0));
    const foot = document.createElement("tr");
    const footHead = document.createElement("th");
    footHead.scope = "row";
    footHead.textContent = "出勤人数";
    foot.appendChild(footHead);
    dailyCounts.forEach((count, d) => {
      const td = document.createElement("td");
      td.textContent = count + "人";
      if (count < needed) td.className = "error";
      foot.appendChild(td);
    });
    const total = document.createElement("td");
    total.textContent = "—";
    foot.appendChild(total);
    body.appendChild(foot);

    result.className = "notice";
    const shortages = days.map((day, d) => ({day, count:dailyCounts[d]})).filter(x => x.count < needed);
    if (shortages.length) {
      result.className = "notice error";
      result.textContent = "人数が足りない日があります：" + shortages.map(x => x.day + "曜日（" + x.count + "人／必要" + needed + "人）").join("、") + "。希望休を見直すか、必要人数を減らしてください。";
    } else {
      const min = Math.min(...candidate.counts), max = Math.max(...candidate.counts);
      result.textContent = "シフトを作成しました。希望休は反映済みです。出勤回数：" + min + "〜" + max + "回。";
    }
  }

  function saveCsv() {
    if (!latestSchedule) return;
    const rows = [["スタッフ", ...days.map(d => d + "曜日"), "出勤回数"]];
    names.forEach((name, s) => {
      rows.push([name, ...latestSchedule[s].map(on => on ? "○" : ""), latestCounts[s]]);
    });
    const dailyCounts = days.map((_, d) => latestSchedule.reduce((sum, staff) => sum + (staff[d] ? 1 : 0), 0));
    rows.push(["出勤人数", ...dailyCounts, ""]);
    rows.push(["必要人数", ...days.map(() => latestNeeded), ""]);
    const csv = "\uFEFF" + rows.map(row => row.map(value => {
      const text = String(value);
      return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
    }).join(",")).join("\r\n");
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "シフト表.csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  document.getElementById("make").addEventListener("click", createSchedule);
  document.getElementById("clear").addEventListener("click", () => {
    document.querySelectorAll(".unavailable").forEach(cb => cb.checked = false);
  });
  saveButton.addEventListener("click", saveCsv);
})();
</script>
</body>
</html>
